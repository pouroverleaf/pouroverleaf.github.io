<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · pouroverleaf</title>
    <link rel="icon" type="image/png" href="/img/Logo.png" />
    <style>
      @font-face { font-family: "Pokemon Emerald"; src: url("/fonts/pokemon-emerald.ttf") format("truetype"); font-display: swap; }
      html, body { margin: 0; height: 100%; background: #F6F0E6; color: #2E2E34; font-family: "Pokemon Emerald", ui-monospace, monospace; }
      main { min-height: 100%; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
      .box {
        width: min(34rem, 100%);
        background: #FFFDF8;
        border: 3px solid #1D2847;
        border-radius: 10px;
        box-shadow: inset 0 0 0 2px #FFFDF8, inset 0 0 0 4px #992A2A, 0 3px 0 rgba(29, 40, 71, 0.18);
        padding: 1.2rem 1.4rem 1.3rem;
        text-shadow: 1px 1px 0 #C9C3B8;
        font-size: 1.3rem;
        line-height: 1.45;
      }
      img { display: block; width: 100%; max-height: 50vh; object-fit: contain; margin-bottom: 1rem; image-rendering: pixelated; }
      a { color: #710318; }
      .cursor::after { content: "▼"; margin-left: .5em; font-size: .75em; color: #710318; text-shadow: none; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <main>
      <div class="box">
        <img src="/img/frieren.gif" alt="" />
        <p>404. There is nothing here.</p>
        <p><a href="/">back to pouroverleaf</a><span class="cursor"></span></p>
      </div>
    </main>
  </body>
</html>
